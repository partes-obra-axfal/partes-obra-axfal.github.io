#app{position:relative;z-index:1}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
input,textarea{width:100%;min-width:0;border:1.5px solid var(--borde);border-radius:10px;background:#fff;padding:10px 12px;box-shadow:inset 0 1px 2px rgba(90,58,30,.08)}
input:focus-visible,textarea:focus-visible,button:focus-visible{outline:2.5px solid var(--verde);outline-offset:2px}
textarea{resize:vertical;min-height:70px}
.barra{position:sticky;top:0;z-index:5;background:#fff;box-shadow:0 2px 10px rgba(90,58,30,.18)}
.barra .in{max-width:640px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.barra img{height:30px;width:auto;display:block}
.barra .t{font-family:var(--disp);font-weight:700;font-size:21px;text-transform:uppercase;line-height:1}
.barra .q{font-size:13px;color:var(--mu)}
.barra .q b{color:var(--verde);font-weight:600}
.barra .esp{flex:1}
.lnk{color:var(--mu);text-decoration:underline;font-size:14px;padding:6px 0}
.prueba{max-width:640px;margin:10px auto 0;padding:0 16px}
.prueba div{background:#fff3cd;border:1px solid #e9cf7f;color:#6b4e00;border-radius:10px;padding:8px 12px;font-size:13px}
main{max-width:640px;margin:0 auto;padding:16px 16px 140px;display:grid;gap:18px}
.card{background:#fff;border-radius:14px;box-shadow:var(--sombra);padding:16px;display:grid;gap:12px;min-width:0}
h2{font-family:var(--disp);font-weight:700;font-size:19px;text-transform:uppercase;letter-spacing:.05em;color:var(--verde);margin:0;display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
h2 small{font-family:var(--txt);font-weight:500;font-size:13px;color:var(--mu);text-transform:none;letter-spacing:0}
.nota{font-size:14px;color:var(--mu);margin:0}
.volver{font-weight:600;color:var(--verde);padding:6px 0;justify-self:start;font-size:15px}
.obra-cab b{font-family:var(--disp);font-size:28px;line-height:1;display:block;text-transform:uppercase}
.obra-cab span{color:var(--mu);font-size:14px}
.btn{border-radius:10px;padding:11px 14px;font-weight:600;background:var(--crema);border:1px solid var(--borde);box-shadow:var(--sombra-b);text-align:center}
.btn:active{box-shadow:inset 0 2px 4px rgba(0,0,0,.18)}
.go{border-radius:12px;padding:13px 16px;background:var(--verde);color:#fff;font-family:var(--disp);font-weight:700;font-size:20px;letter-spacing:.04em;text-transform:uppercase;box-shadow:0 3px 8px rgba(31,92,34,.45);text-align:center;width:100%}
.go:active{background:var(--verde-osc)}
.go.armado,.btn.armado{background:var(--peligro);color:#fff;border-color:var(--peligro)}
.peligro-lnk{color:var(--peligro);text-decoration:underline;font-size:14px;justify-self:start;padding:6px 0}
.fila2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label.f{display:grid;gap:4px;font-size:13px;color:var(--mu);font-weight:500}
/* listas */
.item{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;padding:12px;border-radius:12px;background:var(--crema);border:1px solid var(--borde);box-shadow:var(--sombra-b);text-align:left;width:100%}
.item .n{font-weight:700;font-family:var(--disp);font-size:20px;text-transform:uppercase;line-height:1.05}
.item .d{font-size:13px;color:var(--mu);grid-column:1}
.item .flecha{grid-row:1/3;grid-column:2;color:var(--verde);font-size:22px;font-weight:700}
.item .acc{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.item .acc .btn{padding:8px 12px;font-size:14px;background:#fff}
.lista{display:grid;gap:10px}
.sync{background:#fff3cd;border:1px solid #e9cf7f;color:#6b4e00;border-radius:12px;padding:10px 14px;font-size:14px;box-shadow:var(--sombra-b)}
.sync.mal{background:#fbe9e5;border-color:#e8c4bc;color:#7a2416}
#sync:empty{display:none}
.item.selec{grid-template-columns:auto 1fr}
.item.selec .casilla{grid-row:1/3;grid-column:1}
.item.selec .n,.item.selec .d{grid-column:2}
.casilla{width:28px;height:28px;border-radius:8px;border:2px solid #a88a66;background:#fff;display:grid;place-items:center;color:#fff;font-weight:700;font-size:17px}
.casilla.on{background:var(--peligro);border-color:var(--peligro)}
.item.marcada{border-color:var(--peligro);background:#fbe9e5}
.selbar{border:2px solid var(--peligro)}
.selbar h2{color:var(--peligro)}
.btn.rojo{background:var(--peligro);color:#fff;border-color:var(--peligro)}
.estado{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;justify-self:start}
.estado.ok{background:#e3f1df;color:var(--verde-osc)}
.estado.pend{background:#fff3cd;color:#6b4e00}
/* resumen */
.res{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:8px}
.res div{background:var(--crema);border-radius:10px;padding:8px 10px;border:1px solid var(--borde)}
.res b{display:block;font-family:var(--disp);font-size:22px;line-height:1.1}
.res span{font-size:12px;color:var(--mu)}
.res .mal{border-color:var(--aviso);background:#fdf0e1}
.res .mal b{color:var(--aviso)}
/* chips personal */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border-radius:999px;padding:8px 13px;font-weight:600;font-size:14px;background:var(--crema);border:1px solid var(--borde);box-shadow:var(--sombra-b);color:#5a4632}
.chip.on{background:var(--verde);border-color:var(--verde);color:#fff;box-shadow:inset 0 2px 4px rgba(0,0,0,.25)}
.chip.enc::after{content:" · enc.";font-weight:500;opacity:.85}
.pers{display:grid;gap:8px}
.pers .p{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 6px 6px 12px;border-radius:10px;background:var(--crema);border:1px solid var(--borde)}
.pers .p span{font-weight:600;font-size:15px;min-width:0;overflow-wrap:anywhere}
.pers .p small{display:block;font-weight:500;color:var(--mu);font-size:12px}
/* stepper */
.step{display:inline-flex;align-items:center;background:#fff;border:1.5px solid var(--borde);border-radius:10px;flex:none}
.step button{width:40px;height:40px;font-size:22px;font-weight:700;color:var(--verde)}
.step .v{min-width:58px;text-align:center;font-family:var(--disp);font-weight:700;font-size:19px}
/* tarjetas de máquinas y materiales */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.maq{position:relative;border-radius:12px;padding:10px 11px;background:var(--crema);border:1px solid var(--borde);box-shadow:var(--sombra-b);text-align:left;display:grid;gap:6px;align-content:start;min-height:64px;min-width:0}
.maq .nm{font-size:13.5px;font-weight:600;line-height:1.2;color:#5a4632;padding-right:16px}
.maq .u{font-size:12px;color:var(--mu)}
.maq .mas{position:absolute;right:9px;top:7px;font-weight:700;color:#a88a66;font-size:17px}
.maq.on{background:var(--verde);border-color:var(--verde);box-shadow:inset 0 2px 4px rgba(0,0,0,.25)}
.maq.on .nm{color:#fff}
.maq.on .step{border-color:#fff;width:100%;justify-content:space-between}
.maq.on .step button{width:36px;height:36px}
.maq .tin{display:flex;align-items:center;gap:6px}
.maq .tin input{padding:7px 8px;font-family:var(--disp);font-weight:700;font-size:19px;text-align:right}
.maq .tin span{color:#fff;font-weight:700}
.tira{display:grid;place-items:center;width:40px;height:40px;border-radius:10px;color:var(--peligro);background:#fff;border:1.5px solid #e8c4bc;flex:none}
.tira:active{background:#fbe9e5}
/* papelera de los días */
.dia-fila{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:stretch}
.dia-fila .tira{height:auto;width:54px;align-self:stretch}
.dia-fila .tira svg{width:26px;height:26px}
.dia-fila .tira.armado{width:88px;background:var(--peligro);border-color:var(--peligro);color:#fff;font-size:13px;font-weight:700;line-height:1.15;padding:4px}
.btn.borrar-dia{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--peligro);border-color:#e8c4bc;background:#fff}
.btn.borrar-dia.armado{color:#fff;background:var(--peligro);border-color:var(--peligro)}
.maq .tira{position:absolute;right:6px;top:6px;width:32px;height:32px;border-radius:8px;border:0;background:rgba(255,255,255,.92)}
.maq.on .nm{padding-right:38px;min-height:32px}
.pers .p .step{margin-left:auto}
.pers .p.sp{padding-left:6px}
.pers .p.sp input{flex:1;min-width:0;padding:8px 10px}
.pers .p.sp2{flex-wrap:wrap;gap:8px}
.pers .p.sp2>span:first-child{flex:1 1 calc(100% - 60px)}
.pers .p.sp2 .tira{order:1}
.pers .p.sp2 .step{margin-left:0;order:2;flex:1 1 140px;justify-content:space-between}
.pers .p.sp2 .step .v{min-width:70px}
.step .v input{width:52px;border:0;box-shadow:none;padding:0;text-align:right;font:inherit;background:transparent}
.sub-t{font-family:var(--disp);font-size:16px;text-transform:uppercase;letter-spacing:.04em;color:var(--mu);margin:6px 0 0}
.sub{display:grid;grid-template-columns:1fr 84px 40px;gap:8px;align-items:center}
.espesor{font-size:14px;color:var(--mu)}
.espesor b{color:var(--ink)}
.espesor.mal b{color:var(--aviso)}
/* pie */
.pie{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#fff;box-shadow:0 -4px 14px rgba(90,58,30,.2)}
.pie .in{max-width:640px;margin:0 auto;padding:10px 16px 14px;display:grid;gap:6px}
.pie .msg{font-size:14px;color:var(--mu);text-align:center;min-height:18px}
.pie .msg.ok{color:var(--verde-osc);font-weight:600}
.pie .msg.mal{color:var(--aviso);font-weight:600}
/* PIN */
.pin{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.pin .caja{background:#fff;border-radius:18px;box-shadow:var(--sombra);padding:24px 20px;width:100%;max-width:340px;display:grid;gap:18px;justify-items:center;text-align:center}
.pin img{height:44px}
.pin h1{font-family:var(--disp);font-size:28px;text-transform:uppercase;margin:0}
.puntos{display:flex;gap:14px}
.puntos span{width:16px;height:16px;border-radius:50%;border:2px solid var(--borde)}
.puntos span.on{background:var(--verde);border-color:var(--verde)}
.teclado{display:grid;grid-template-columns:repeat(3,72px);gap:12px}
.teclado button{height:58px;border-radius:14px;background:var(--crema);border:1px solid var(--borde);box-shadow:var(--sombra-b);font-family:var(--disp);font-size:26px;font-weight:700}
.teclado button.peq{font-family:var(--txt);font-size:14px;font-weight:600;color:var(--mu)}
.aviso{color:var(--aviso);font-size:14px;min-height:18px;margin:0}
.toast .deshacer{margin-left:12px;background:#fff;color:#3a2a1a;border-radius:8px;padding:6px 12px;font-weight:700}
[hidden].toast{display:none}
.toast{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px;position:fixed;left:50%;transform:translateX(-50%);bottom:110px;z-index:20;background:#3a2a1a;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;box-shadow:var(--sombra);max-width:90vw;text-align:center}

/* pantalla de día guardado y parte */
main.ancho{max-width:1200px}
.guardado{text-align:left}
.ok-grande{width:56px;height:56px;border-radius:50%;background:var(--verde);color:#fff;display:grid;place-items:center;font-size:32px;font-weight:700;box-shadow:0 3px 8px rgba(31,92,34,.45)}
.resumen-dia{margin:0;padding-left:18px;display:grid;gap:4px;font-size:15px}
.resumen-dia b{color:var(--verde-osc)}
.aviso-cierre{border:2px solid var(--aviso)}
.aviso-cierre h2{color:var(--aviso)}
.xlwrap{overflow-x:auto;border:1px solid var(--borde);border-radius:8px;background:#fff;-webkit-overflow-scrolling:touch}
.xl{font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#000;padding:10px;width:max-content}
.xltit{text-align:center;font-weight:700;text-decoration:underline;margin:2px 0 10px}
.xlcab{border-collapse:collapse;margin-bottom:10px}
.xlcab th{text-align:right;text-decoration:underline;padding:2px 6px;white-space:nowrap}
.xlcab td{padding:2px 6px;min-width:260px;font-weight:700}
.xlcab td.caja{border:1px solid #000}
.xlt{border-collapse:collapse;border:2px solid #000}
.xlt td,.xlt th{border:1px solid #9a9a9a;padding:1px 4px;height:16px;white-space:nowrap}
.xlt td{text-align:right;min-width:40px}
.xlt td.lab{text-align:left;position:sticky;left:0;background:#fff;min-width:230px;max-width:230px;overflow:hidden;text-overflow:ellipsis;z-index:1;border-right:1px solid #000}
.xlt tr.sec th{color:#1f3fd6;font-weight:700;text-align:center;border-top:2px solid #000;background:#fff}
.xlt tr.sec th:first-child{text-align:left;position:sticky;left:0;z-index:1;border-right:1px solid #000;min-width:230px;max-width:230px;overflow:hidden;text-overflow:ellipsis}
.xlt .tot{border-left:2px solid #000;border-right:2px solid #000;min-width:62px}
.xlt .hoy{background:#e3f1df}
.xlt tr.sec th.hoy{background:#cfe8c8}
.xlt .subn{color:#1f3fd6}
.xlt tr.hueco td{border-left:0;border-right:0;height:10px}
.xlt tr.supf td{font-size:10.5px}
.xlres{display:flex;gap:40px;align-items:flex-start;margin-top:12px;flex-wrap:wrap}
.xlres table{border-collapse:collapse}
.xlres td,.xlres th{padding:2px 6px}
.xlres td.num{border:1px solid #000;text-align:right;min-width:110px;color:#1f3fd6}
.xlres .costes th{text-align:left;font-weight:700}
.xlres .costes td.num{color:#000;border:0;border-bottom:1px solid #ddd}
.xlres .venta th{text-align:center;border:1px solid #000}
.xlres .amarillo{background:#ffff00!important}
.xlobs{display:flex;gap:10px;margin-top:14px}
.xlobs>b{white-space:nowrap}
.xlobs>div{border:1px solid #000;min-width:420px;padding:2px 6px}
.xlobs .vacio{color:#999}
@media (max-width:700px){.xlt td.lab,.xlt tr.sec th:first-child{min-width:150px;max-width:150px}.xlcab td{min-width:180px}.xlobs>div{min-width:260px}}
@media (max-width:360px){.grid{grid-template-columns:1fr}}
</style>
</head>

<script>// Monta el Excel del parte de obra (estudio de costes) a partir de la plantilla de Sergio.
// - Una columna por día trabajado. Si hay más de 6 días, se insertan columnas antes de TOTAL
//   y se ajustan fórmulas, combinadas y anchos. Si hay menos, sobran columnas en blanco (como el modelo).
// - Solo se tocan valores: el formato, bordes e impresión quedan como en la plantilla.
(function (root) {
  const COL_INI = 3, COL_FIN = 8, DIAS_MODELO = 6; // C..H
  const ANCHO_DIA = 6.7;

  const colNum = s => { let n = 0; for (const ch of s) n = n * 26 + ch.charCodeAt(0) - 64; return n; };
  const colTxt = n => { let s = ""; while (n > 0) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); } return s; };
  const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  const REF = /(\$?)([A-Z]{1,3})(\$?)(\d+)/g;

  // Mueve las referencias de una fórmula (para expandir fórmulas compartidas).
  function trasladar(f, dr, dc) {
    return f.replace(REF, (m, a, c, b, r) => (a ? "" : "") + colTxt(colNum(c) + (a ? 0 : dc)) + String(Number(r) + (b ? 0 : dr)));
  }
  // Inserta k columnas en la posición COL_FIN (H pasa a H+k). Los rangos que cruzan H se alargan.
  function desplazarRefs(txt, k) {
    if (!k) return txt;
    return txt.replace(/([A-Z]{1,3})(\d+)(?::([A-Z]{1,3})(\d+))?/g, (m, c1, r1, c2, r2) => {
      const a = colNum(c1);
      if (c2 == null) return colTxt(a >= COL_FIN ? a + k : a) + r1;
      const b = colNum(c2);
      const na = a >= COL_FIN ? a + k : a, nb = b >= COL_FIN ? b + k : b;
      return colTxt(na) + r1 + ":" + colTxt(nb) + r2;
    });
  }

  function leerCeldas(rowXml) {
    const out = [];
    const re = /<c r="([A-Z]+)(\d+)"([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g;
    let m;
    while ((m = re.exec(rowXml))) {
      const attrs = m[3], body = m[4] || "";
      const s = (/ s="(\d+)"/.exec(attrs) || [])[1];
      const t = (/ t="(\w+)"/.exec(attrs) || [])[1];
      const fm = /<f([^>]*)(?:\/>|>([\s\S]*?)<\/f>)/.exec(body);
      let f = null, shared = null;
      if (fm) {
        f = fm[2] != null ? fm[2] : null;
        const si = (/ si="(\d+)"/.exec(fm[1]) || [])[1];
        if (/t="shared"/.test(fm[1])) shared = si;
      }
      const v = (/<v>([\s\S]*?)<\/v>/.exec(body) || [])[1];
      const is = (/<is>([\s\S]*?)<\/is>/.exec(body) || [])[1];
      out.push({ col: colNum(m[1]), row: Number(m[2]), s, t, f, shared, v, is });
    }
    return out;
  }
  function celdaXml(c) {
    const ref = colTxt(c.col) + c.row;
    const st = c.s != null ? ` s="${c.s}"` : "";
    if (c.f != null) return `<c r="${ref}"${st}><f>${c.f}</f></c>`;
    if (c.val === undefined) {
      // celda original sin tocar
      if (c.t === "s") return `<c r="${ref}"${st} t="s"><v>${c.v}</v></c>`;
      if (c.is != null) return `<c r="${ref}"${st} t="inlineStr"><is>${c.is}</is></c>`;
      if (c.v != null && c.t !== "e") return `<c r="${ref}"${st}${c.t ? ` t="${c.t}"` : ""}><v>${c.v}</v></c>`;
      return `<c r="${ref}"${st}/>`;
    }
    if (c.val === null || c.val === "") return `<c r="${ref}"${st}/>`;
    if (typeof c.val === "number") return `<c r="${ref}"${st}><v>${c.val}</v></c>`;
    return `<c r="${ref}"${st} t="inlineStr"><is><t xml:space="preserve">${esc(c.val)}</t></is></c>`;
  }

  // datos = { obra, cliente, encargado, dias:[{fecha:"YYYY-MM-DD", celdas:{fila:valor}}], subcontratas:[{nombre, porDia:[...]}],
  //           obs:["12/11: texto", ...] }
  async function construir(JSZip, plantilla, datos) {
    const zip = await JSZip.loadAsync(plantilla);
    const path = "xl/worksheets/sheet1.xml";
    let xml = await zip.file(path).async("string");
    const N = Math.max(datos.dias.length, 1);
    const k = Math.max(0, N - DIAS_MODELO);
    const nCols = Math.max(N, DIAS_MODELO);

    const ini = xml.indexOf("<sheetData>"), fin = xml.indexOf("</sheetData>");
    let antes = xml.slice(0, ini), datosXml = xml.slice(ini + 11, fin), despues = xml.slice(fin);

    // 1) Leer filas y celdas, expandir fórmulas compartidas.
    const filas = [];
    const masters = {};
    const reRow = /<row ([^>]*?)(?:\/>|>([\s\S]*?)<\/row>)/g;
    let m;
    while ((m = reRow.exec(datosXml))) {
      const attrs = m[1].replace(/ spans="[^"]*"/, "");
      const r = Number(/r="(\d+)"/.exec(attrs)[1]);
      const celdas = m[2] ? leerCeldas(m[2]) : [];
      celdas.forEach(c => { if (c.shared != null && c.f) masters[c.shared] = c; });
      filas.push({ r, attrs, celdas });
    }
    filas.forEach(fl => fl.celdas.forEach(c => {
      if (c.shared != null && !c.f) { const ms = masters[c.shared]; c.f = trasladar(ms.f, c.row - ms.row, c.col - ms.col); }
    }));

    // 2) Insertar columnas (copiando la del penúltimo día, G) y desplazar.
    filas.forEach(fl => {
      if (!k) return;
      const g = fl.celdas.find(c => c.col === COL_FIN - 1);
      fl.celdas.forEach(c => { if (c.col >= COL_FIN) c.col += k; if (c.f) c.f = desplazarRefs(c.f, k); });
      if (g) {
        for (let i = 0; i < k; i++) {
          const col = COL_FIN + i;
          const nc = { col, row: fl.r, s: g.s };
          if (g.f) nc.f = trasladar(g.f, 0, col - g.col);
          fl.celdas.push(nc);
        }
      }
      fl.celdas.sort((a, b) => a.col - b.col);
    });
    // Las fórmulas de la columna G (antes de mover) no tocan H; las de cabecera «=C10» ya están bien.

    const fila = r => {
      let fl = filas.find(x => x.r === r);
      if (!fl) { fl = { r, attrs: `r="${r}"`, celdas: [] }; filas.push(fl); filas.sort((a, b) => a.r - b.r); }
      return fl;
    };
    const poner = (col, r, val, estiloDe) => {
      const fl = fila(r);
      let c = fl.celdas.find(x => x.col === col);
      if (!c) {
        c = { col, row: r };
        const ref = estiloDe ? fila(estiloDe[1]).celdas.find(x => x.col === estiloDe[0]) : null;
        if (ref) c.s = ref.s;
        fl.celdas.push(c); fl.celdas.sort((a, b) => a.col - b.col);
      }
      c.f = null; c.val = val;
    };

    // 3) Cabecera
    poner(2, 3, datos.encargado || "");
    poner(2, 5, datos.cliente || "");
    poner(2, 7, datos.obra || "");
    poner(2, 8, datos.mes || "");

    // 4) Días
    datos.dias.forEach((d, i) => {
      const col = COL_INI + i;
      const [y, mo, dd] = d.fecha.split("-");
      // Cabecera del día: solo el número si toda la obra es del mismo mes; «d/m» si cambia de mes.
      poner(col, 10, d.cab != null ? d.cab : `${Number(dd)}/${Number(mo)}`);
      Object.keys(d.celdas).forEach(r => {
        const v = d.celdas[r];
        poner(col, Number(r), v ? Math.round(v * 100) / 100 : "");
      });
    });
    // Columnas de día sin usar: cabecera vacía en vez de 0
    for (let i = datos.dias.length; i < nCols; i++) [10, 14, 29, 33, 40, 52].forEach(r => poner(COL_INI + i, r, ""));

    // 5) Subcontratas (filas 53 a 55)
    (datos.subcontratas || []).slice(0, 3).forEach((s, j) => {
      const r = 53 + j;
      poner(1, r, s.nombre);
      s.porDia.forEach((v, i) => poner(COL_INI + i, r, v ? v : ""));
      // total
      const fl = fila(r); const tc = COL_FIN + 1 + k;
      let c = fl.celdas.find(x => x.col === tc);
      if (c) { c.f = `SUM(${colTxt(COL_INI)}${r}:${colTxt(COL_FIN + k)}${r})`; c.val = undefined; }
    });

    // 6) Observaciones: una línea por día desde la fila 72 (se añaden filas si hacen falta)
    const obs = datos.obs || [];
    const merges = [];
    obs.forEach((t, i) => {
      const r = 72 + i;
      if (r > 73) {
        // copiar formato de la fila 73
        const base = fila(73);
        const fl = fila(r);
        base.celdas.forEach(c => { if (!fl.celdas.find(x => x.col === c.col)) fl.celdas.push({ col: c.col, row: r, s: c.s }); });
        fl.celdas.sort((a, b) => a.col - b.col);
        fl.attrs = base.attrs.replace(/r="\d+"/, `r="${r}"`);
        merges.push(`B${r}:${colTxt(11 + k)}${r}`);
      }
      poner(2, r, t);
    });

    // 7) Volver a escribir el XML
    const nuevoDatos = filas.map(fl => {
      if (!fl.celdas.length) return `<row ${fl.attrs}/>`;
      return `<row ${fl.attrs}>` + fl.celdas.map(c => { c.row = fl.r; return celdaXml(c); }).join("") + `</row>`;
    }).join("");

    // anchos de columna
    antes = antes.replace(/<cols>([\s\S]*?)<\/cols>/, (all, inner) => {
      const cols = inner.match(/<col [^>]*\/>/g).map(c => {
        let mn = Number(/min="(\d+)"/.exec(c)[1]), mx = Number(/max="(\d+)"/.exec(c)[1]);
        if (mn === COL_INI && mx === COL_FIN) { mx = COL_FIN + k; return c.replace(/max="\d+"/, `max="${mx}"`).replace(/width="[\d.]+"/, `width="${ANCHO_DIA}"`); }
        if (mn >= COL_FIN) { mn += k; mx += k; }
        return c.replace(/min="\d+"/, `min="${mn}"`).replace(/max="\d+"/, `max="${mx}"`);
      });
      return "<cols>" + cols.join("") + "</cols>";
    });
    antes = antes.replace(/<dimension ref="[^"]*"\/>/, `<dimension ref="A1:${colTxt(17 + k)}1000"/>`);
    antes = antes.replace(/<selection [^>]*\/>/, `<selection activeCell="A1" sqref="A1"/>`).replace(/topLeftCell="[^"]*"/, 'topLeftCell="A1"').replace(/zoomScale="\d+"/, 'zoomScale="100"');

    despues = despues.replace(/<mergeCells count="\d+">([\s\S]*?)<\/mergeCells>/, (all, inner) => {
      const refs = (inner.match(/ref="([^"]+)"/g) || []).map(x => desplazarRefs(/ref="([^"]+)"/.exec(x)[1], k)).concat(merges);
      return `<mergeCells count="${refs.length}">` + refs.map(r => `<mergeCell ref="${r}"/>`).join("") + "</mergeCells>";
    });

    xml = antes + "<sheetData>" + nuevoDatos + despues;
    zip.file(path, xml);

    // Que Excel recalcule al abrir
    zip.remove("xl/calcChain.xml");
    let ct = await zip.file("[Content_Types].xml").async("string");
    zip.file("[Content_Types].xml", ct.replace(/<Override[^>]*calcChain[^>]*\/>/, ""));
    let rels = await zip.file("xl/_rels/workbook.xml.rels").async("string");
    zip.file("xl/_rels/workbook.xml.rels", rels.replace(/<Relationship[^>]*calcChain[^>]*\/>/, ""));
    let wb = await zip.file("xl/workbook.xml").async("string");
    wb = /<calcPr[^>]*fullCalcOnLoad/.test(wb) ? wb : wb.replace(/<calcPr /, '<calcPr fullCalcOnLoad="1" ');
    wb = wb.replace(/<x15ac:absPath[^>]*\/>/, "");
    zip.file("xl/workbook.xml", wb);

    return zip.generateAsync({ type: "uint8array", compression: "DEFLATE" });
  }

  const api = { construir };
  if (typeof module !== "undefined") module.exports = api; else root.ExcelObra = api;
})(typeof window !== "undefined" ? window : globalThis);
</script>

// ---------- utilidades ----------
const h = s => String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
// Lee números escritos a mano: «1.500» (miles), «1,5» o «1.5» (decimales).
const numSuelto = v => {
  if (typeof v === "number") return isFinite(v) ? v : 0;
  let s = String(v == null ? "" : v).replace(/\s/g, ""); if (!s) return 0;
  if (s.includes(",")) s = s.replace(/\./g, "").replace(",", ".");
  else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, "");
  const n = Number(s); return isFinite(n) ? n : 0;
};
const num = numSuelto;
const fmt = (n, dec) => { const r = Math.round(n * 100) / 100; return (dec != null ? r.toFixed(dec) : String(r)).replace(".", ","); };
const fmtMiles = n => Math.round(n).toLocaleString("es-ES");
const hoy = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
const fCorta = iso => { const [y, m, d] = iso.split("-"); return `${+d}/${+m}`; };
const fLarga = iso => { const d = new Date(iso + "T12:00:00"); return `${DIAS[d.getDay()]} ${fCorta(iso)}`; };
const fGuion = iso => { const [y, m, d] = iso.split("-"); return `${+d}-${m}-${y}`; };

function etiqueta(v, u) {
  if (u === "h") return fmt(v) + " h";
  if (u === "t") return fmt(v) + " t";
  if (u === "f") return fmt(v) + " furg.";
  return v === 1 ? "1 día" : fmt(v) + " días";
}
const cap = x => x.charAt(0) + x.slice(1).toLowerCase();
// Nombre corto para los botones: el nombre de pila, o nombre y apellido si hay dos con el mismo nombre.
const nombreCorto = n => { const p = n.split(" "); const rep = trab().filter(x => x.split(" ")[0] === p[0]).length > 1; return (rep ? p.slice(0, 2) : p.slice(0, 1)).map(cap).join(" "); };

function totales(dias) {
  let horas = 0, t = 0, m2 = 0, fres = 0;
  dias.forEach(d => {
    Object.values(d.personal).forEach(x => horas += num(x));
    if (d.subp) horas += num(d.subp.horas);
    FILAS_MEZCLA.forEach(f => t += numSuelto(d.v[f]));
    m2 += numSuelto(d.m2mbc); fres += numSuelto(d.m2fres);
  });
  const esp = m2 > 0 && t > 0 ? t / m2 / 2.4 * 100 : null;
  return { horas, t, m2, fres, esp };
}

const nXl = v => { if (!v) return ""; const r = Math.round(v * 100) / 100; return String(r).replace(".", ","); };
const n2 = v => (Math.round(v * 100) / 100).toFixed(2).replace(".", ",").replace(/\B(?=(\d{3})+(?!\d))/g, ".");
const dv = (a, b) => b ? n2(a / b) : "#¡DIV/0!";
function htmlVista() {

  const val = (r, i) => { if (sub[r]) return sub[r].porDia[i] || 0; const d = X.dias[i]; return d ? numSuelto(d.celdas[r]) : 0; };
  const totFila = r => { let t = 0; for (let i = 0; i < X.dias.length; i++) t += val(r, i); return t; };
  const cab = (i) => { const d = X.dias[i]; return d ? d.cab : ""; };
  const cls = i => i === marcada ? ' class="hoy"' : "";
  let coste = 0;
  let filas = FILAS_XL.map(([r, txt, sec]) => {
    if (sec) return `<tr class="sec"><th>${h(txt)}</th>${Array.from({ length: N }, (_, i) => `<th${cls(i)}>${cab(i)}</th>`).join("")}<th class="tot">TOTAL</th><th>Importe</th><th>Total</th></tr>`;
    const t = totFila(r), p = PRECIOS[r] || 0; coste += t * p;
    const nombre = sub[r] ? `<b class="subn">${h(sub[r].nombre)}</b>` : h(txt);
    return `<tr><td class="lab">${nombre}</td>${Array.from({ length: N }, (_, i) => `<td${cls(i)}>${nXl(val(r, i))}</td>`).join("")}<td class="tot">${r >= 53 && !sub[r] ? "" : n2(t)}</td><td>${r >= 53 ? "" : n2(p)}</td><td>${r >= 53 ? "" : n2(t * p)}</td></tr>`;
  }).join("");
  const sup = (r, txt) => { const t = totFila(r); return `<tr class="supf"><td class="lab"><b>${txt}</b></td>${Array.from({ length: N }, (_, i) => `<td${cls(i)}>${val(r, i) ? fmtMiles(val(r, i)) : ""}</td>`).join("")}<td class="tot">${n2(t)}</td><td></td><td></td></tr>`; };
  const m2 = totFila(57), tm = FILAS_MEZCLA.reduce((s, r) => s + totFila(r), 0);
  const ind = coste * IND / 100, am = coste * AMORT / 100, total = coste + ind + am;
  const transp = [31, 32].reduce((s, r) => s + totFila(r) * (PRECIOS[r] || 0), 0);
  const obs = X.obs.length ? X.obs.map(t => `<div>${h(t)}</div>`).join("") : `<div class="vacio">—</div>`;
  return `<div class="card xlcard"><h2>Parte de la obra <small>así queda el Excel</small></h2>
  <div class="xlwrap" id="xlwrap"><div class="xl">
    <div class="xltit">ESTUDIO DE COSTES / OBRA DE AGLOMERADO</div>
    <table class="xlcab"><tr><th>ENCARGADO:</th><td>${h(X.encargado)}</td></tr><tr><th>CLIENTE:</th><td class="caja">${h(X.cliente)}</td></tr><tr><th>CÓDIGO/OBRA:</th><td class="caja">${h(X.obra)}</td></tr><tr><th>MES:</th><td>${h(X.mes)}</td></tr></table>
    <table class="xlt">${filas}<tr class="hueco"><td colspan="${N + 4}"></td></tr>${sup(57, "Superficie (m²) MBC")}${sup(59, "Superficie (m²) Fresado")}</table>
    <div class="xlres">
      <table><tr><td class="num">${m2 ? n2(tm / m2 / 2.4 * 100) : "#¡DIV/0!"}</td><td>cm/m²</td></tr><tr><td class="num">${n2(m2)}</td><td>m²</td></tr><tr><td class="num">${n2(tm)}</td><td>tm</td></tr><tr><td class="num">${dv(total, m2)}</td><td>€/m²</td></tr><tr><td class="num">${dv(total, tm)}</td><td>€/tm</td></tr><tr><td class="num">${dv(transp, tm)}</td><td>€/tm transportada</td></tr></table>
      <table class="costes"><tr><th>Coste Neto</th><td></td><td class="num">${n2(coste)}</td></tr><tr><th>C. Indirectos %</th><td>${fmt(IND)}</td><td class="num">${n2(ind)}</td></tr><tr><th>Amortizaciones %</th><td>${fmt(AMORT)}</td><td class="num">${n2(am)}</td></tr><tr><th>Coste total</th><td></td><td class="num">${n2(total)}</td></tr><tr class="venta"><th>VENTA</th><td></td><td class="num amarillo"></td></tr><tr class="venta"><th>RESULTADO</th><td></td><td class="num">${n2(0 - total)}</td></tr></table>
    </div>

  <p class="nota">Los importes salen a 0 porque los precios los pone la oficina.${marcada >= 0 ? " La columna verde es el día que acabas de guardar." : ""} Si la tabla no cabe, desliza de lado.</p>

// Desplaza la tabla para que se vea el día que se está rellenando, justo después de la columna de nombres.
function centrarHoy() {
  const w = document.getElementById("xlwrap"), c = w && w.querySelector("th.hoy"), l = w && w.querySelector("td.lab");
  if (!w || !c || !l) return;
  if (c.getBoundingClientRect().right <= w.getBoundingClientRect().right) return; // ya se ve

let tToast = null;
let accionToast = null;

// Copia del día antes de quitar algo, para poder deshacerlo.

// ---------- acciones ----------
document.addEventListener("click", async e => {

// ---------- conexión con la oficina ----------

  const t = setTimeout(() => ctl && ctl.abort(), ms || 30000);

    // Sin cabeceras: así el programa de Google lo acepta sin pedir permisos previos (CORS).
    const r = await fetch(API_URL, { method: "POST", body: JSON.stringify(datos), redirect: "follow", signal: ctl ? ctl.signal : undefined });

// Mezcla las obras guardadas en la oficina con las del móvil: gana la que se cambió más tarde.
// No toca obras con cambios pendientes de subir ni resucita las borradas en el móvil (salvo que la oficina la recuperase después).
function fusionar(lista) {
  let cambios = 0;
  (lista || []).forEach(so => {
    if (!so || !so.id || so.encargado !== S.sesion) return;
    if (S.cola.some(op => op.obraId === so.id)) return;
    so.subido = so.mod;
    const i = S.obras.findIndex(x => x.id === so.id);
    if (i < 0) {
      const p = S.papelera.find(x => x.tipo === "obra" && x.obra.id === so.id);
      if (p && p.borradaEn >= (so.mod || 0)) return;
      if (p) S.papelera = S.papelera.filter(x => x !== p);
      S.obras.push(so); cambios++;
    } else if ((so.mod || 0) > (S.obras[i].mod || 0)) { S.obras[i] = so; cambios++; }
  });
  return cambios;
}

}
function plantilla() { const bin = atob(PLANTILLA_B64); const a = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return a; }
// Compartir el Excel (WhatsApp, correo…) o descargarlo si el móvil no deja compartir.
async function compartirExcel(o, boton) {
  if (!o || !fechas(o).length) return toast("La obra no tiene días todavía.");
  if (boton) boton.disabled = true;
  try {
    const bytes = await ExcelObra.construir(JSZip, plantilla(), datosExcel(o));
    const nombre = nombreArchivo(o), tipo = "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet";
    try {
      const file = new File([bytes], nombre, { type: tipo });
      if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: nombre }); return; }
    } catch (e) { if (e && e.name === "AbortError") return; }
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([bytes], { type: tipo }));
    a.download = nombre; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  } catch (e) {
    toast("No se ha podido hacer el Excel: " + (e && e.message || e));
  } finally { if (boton) boton.disabled = false; }
}

pintar();
if (S.sesion) enviarCola().then(refrescar);
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
